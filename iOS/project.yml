name: Sime
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
schemes:
  Sime:
    build:
      targets:
        Sime: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SimeTests
targets:
  Sime:
    type: application
    platform: iOS
    sources:
      - path: Sime
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismantic.sime
        INFOPLIST_FILE: Sime/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sime/Sime.entitlements
    dependencies:
      - target: SimeKeyboard
        embed: true
  SimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Sime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismantic.sime.tests
        GENERATE_INFOPLIST_FILE: YES
  SimeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - PinyinInfo.plist
          - ShuangpinInfo.plist
      - path: Engine
      - path: ../require/Sime/src
        includes:
          - "*.cc"
      - path: Shared
    preBuildScripts:
      - name: Copy Sime runtime models
        script: |
          cp "$SRCROOT/../require/Sime/save/sime.dict" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sime.dict"
          cp "$SRCROOT/../require/Sime/save/sime.cnt" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sime.cnt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismantic.sime.keyboard
        INFOPLIST_FILE: KeyboardExtension/PinyinInfo.plist
        PRODUCT_NAME: SimeKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/SimeKeyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Engine/sime_api.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../require/Sime/include $(SRCROOT)/../require/Sime/src"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
