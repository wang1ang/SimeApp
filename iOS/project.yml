name: Sime
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "8K3SQFBAJG"
schemes:
  Sime:
    build:
      targets:
        Sime: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SimeTests
targets:
  Sime:
    type: application
    platform: iOS
    sources:
      - path: Sime
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismantic.sime
        INFOPLIST_FILE: Sime/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sime/Sime.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SimeKeyboard
        embed: true
  SimeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: KeyboardExtension/Composition.swift
      - path: KeyboardExtension/PinyinDecoder.swift
      - path: KeyboardExtension/NativePinyinDecoder.swift
      - path: Engine
      - path: ../require/Sime/src
        includes:
          - "*.cc"
      - path: Shared/InputScheme.swift
    dependencies:
      - target: Sime
    preBuildScripts:
      - name: Copy Sime models for end-to-end tests
        script: |
          cp "$SRCROOT/../require/Sime/save/sime.dict" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sime.dict"
          cp "$SRCROOT/../require/Sime/save/sime.cnt" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sime.cnt"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismantic.sime.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Engine/sime_api.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../require/Sime/include $(SRCROOT)/../require/Sime/src"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: "libc++"
  SimeKeyboard:
    type: app-extension
    platform: iOS
    dependencies:
      - framework: Dependencies/ncnn.xcframework
    sources:
      - path: KeyboardExtension
        excludes:
          - PinyinInfo.plist
      - path: Engine
      - path: ../require/Sime/src
        includes:
          - "*.cc"
      - path: Shared
    preBuildScripts:
      - name: Copy Sime runtime models
        script: |
          cp "$SRCROOT/../require/Sime/save/sime.dict" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sime.dict"
          cp "$SRCROOT/../require/Sime/save/sime.cnt" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/sime.cnt"
          cp "$SRCROOT/../require/Sime/save/gru.embedding.i8" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gru.embedding.i8"
          cp "$SRCROOT/../require/Sime/save/gru.pinyin.ncnn.param" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gru.pinyin.ncnn.param"
          cp "$SRCROOT/../require/Sime/save/gru.pinyin.ncnn.bin" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gru.pinyin.ncnn.bin"
          cp "$SRCROOT/../require/Sime/save/gru.t9.ncnn.param" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gru.t9.ncnn.param"
          cp "$SRCROOT/../require/Sime/save/gru.t9.ncnn.bin" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/gru.t9.ncnn.bin"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismantic.sime.keyboard
        INFOPLIST_FILE: KeyboardExtension/PinyinInfo.plist
        PRODUCT_NAME: SimeKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/SimeKeyboard.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Engine/sime_api.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/../require/Sime/include $(SRCROOT)/../require/Sime/src"
        "HEADER_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) $(SRCROOT)/Dependencies/ncnn.xcframework/ios-arm64/Headers"
        "HEADER_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SRCROOT)/Dependencies/ncnn.xcframework/ios-arm64_x86_64-simulator/Headers"
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -DSIME_ENABLE_NCNN=1"
